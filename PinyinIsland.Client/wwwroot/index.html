<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>เกาะมหาสมบัติพินอิน (Pinyin Island)</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Prompt:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
</head>

<body>
    <div id="app">
        <div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, #38ef7d 0%, #11998e 100%);color:white;font-family:'Prompt',sans-serif;">
            <div style="font-size:2rem;font-weight:bold;margin-bottom:1rem;text-shadow:0 2px 4px rgba(0,0,0,0.2);">🏝️ กำลังโหลดเกาะพินอิน...</div>
            <div style="width:48px;height:48px;border:5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#ffecb3;color:#bf360c;padding:0.6rem 1.25rem;box-shadow:0 -1px 2px rgba(0,0,0,0.2);z-index:1000;">
        เกิดข้อผิดพลาดในการโหลดแอปพลิเคชัน
        <a href="" class="reload" style="color:#bf360c;margin-left:1rem;font-weight:bold;">โหลดใหม่</a>
        <a class="dismiss" style="cursor:pointer;position:absolute;right:1rem;top:0.5rem;font-weight:bold;">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/gameAudio.js"></script>
</body>

</html>
